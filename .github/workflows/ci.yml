name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    name: Tools (analyze, check records)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The region file the app ships with, for checking areas.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lychnion/lychnion
          path: app
          sparse-checkout: assets/regions
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.12.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: dart pub get
      - run: dart analyze --fatal-infos tool
      - name: Python tools compile
        run: python -I -m py_compile tool/*.py
      - name: Manifests are valid JSON
        run: |
          for f in items.json packages/*.json maps/*.json packages/translations/*.json; do
            python -I -m json.tool "$f" > /dev/null || { echo "bad JSON: $f"; exit 1; }
          done
      - name: Tool tests
        run: python -I -m unittest discover -s tool -p 'test_*.py'
      # Numbers must match (fails); degree and negation words are warnings
      # for the reviewer.
      - name: Translations keep numbers and meaning words
        run: python -I tool/check_translations.py
      - name: Translation reports in the job summary
        if: ${{ !cancelled() }}
        # The job summary takes at most 1 MiB per step.
        run: |
          shopt -s nullglob
          reports=(build/translation-checks/*.md)
          if [ ${#reports[@]} -gt 0 ]; then
            cat "${reports[@]}" | head -c 900000 >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Areas use known region codes
        env:
          LYCHNION_REGIONS: app/assets/regions/regions.sqlite
        run: python -I tool/check_areas.py
      - name: Every signed record verifies
        run: |
          if [ -f keys.json ]; then
            dart run tool/records.dart check-records --keys keys.json records
          else
            dart run tool/records.dart check-records records
          fi
      # After a replacement of Lychnion's key its statements are in
      # keys.json (see the README); attestations of the new key count then.
      - name: Every attestation verifies
        run: |
          if [ -f keys.json ]; then
            dart run tool/records.dart check-attestations --keys keys.json attestations
          else
            dart run tool/records.dart check-attestations attestations
          fi
