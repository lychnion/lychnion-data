name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    name: Tools (analyze, check records)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.12.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: dart pub get
      - run: dart analyze --fatal-infos tool
      - name: Python tools compile
        run: python -I -m py_compile tool/*.py
      - name: Manifests are valid JSON
        run: |
          for f in items.json packages/*.json maps/*.json packages/translations/*.json; do
            python -I -m json.tool "$f" > /dev/null || { echo "bad JSON: $f"; exit 1; }
          done
      - name: Every signed record verifies
        run: dart run tool/records.dart check-records records
